<!DOCTYPE html>
<!-- WEBVAPT web terminal — the same Textual TUI, rendered in the browser.
     Black ground, white ink. Keys 1-4 switch tabs, Q quits (same as terminal). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WEBVAPT // TERMINAL</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  #term { height: 100vh; width: 100vw; padding: 8px; box-sizing: border-box; }
  #status {
    position: fixed; bottom: 0; left: 0; right: 0;
    font: 12px monospace; color: #9a9a9a; background: #000;
    padding: 2px 10px; display: none;
  }
</style>
</head>
<body>
<div id="term"></div>
<div id="status"></div>
<script src="/static/xterm.js"></script>
<script src="/static/xterm-addon-fit.js"></script>
<script>
  if (typeof Terminal === 'undefined') {
    document.getElementById('status').style.display = 'block';
    document.getElementById('status').textContent =
      'Terminal library failed to load. Reload the page.';
  } else {
  const term = new Terminal({
    cursorBlink: true,
    fontFamily: 'Consolas, "Cascadia Mono", monospace',
    fontSize: 17,
    theme: { background: '#000000', foreground: '#ffffff', cursor: '#ffffff',
             selectionBackground: '#ffffff', selectionForeground: '#000000' }
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('term'));
  fit.fit();
  term.focus();

  const status = document.getElementById('status');
  const show = (m) => { status.style.display = 'block'; status.textContent = m; };

  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(proto + '//' + location.host + '/ws/terminal');

  ws.onopen = () => {
    term.onData((d) => ws.send(d));
    term.onResize(({cols, rows}) => ws.send(JSON.stringify({resize: [cols, rows]})));
    ws.send(JSON.stringify({resize: [term.cols, term.rows]}));
    window.addEventListener('resize', () => fit.fit());
    // Ctrl + / Ctrl - : terminal zoom (refits the TUI to the new grid).
    term.attachCustomKeyEventHandler((e) => {
      if (e.ctrlKey && (e.key === '+' || e.key === '=' || e.key === '-' || e.key === '0')) {
        e.preventDefault();
        let size = term.options.fontSize;
        if (e.key === '0') size = 17;
        else size = Math.min(28, Math.max(12, size + (e.key === '-' ? -1 : 1)));
        term.options.fontSize = size;
        fit.fit();
        return false; // don't send the keystroke to the TUI
      }
      return true;
    });
  };
  ws.onmessage = (ev) => term.write(ev.data);
  ws.onclose = () => { show('Session ended — reload to start a new TUI.'); term.blur(); };
  ws.onerror = () => show('Connection failed — is the server running?');
  }
</script>
</body>
</html>
